[project]
name = "ragwell-async-project-example"
version = "0.0.0"
description = "Sync a local folder, retrieve documents and clean a Ragwell project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ragwell==0.1.0",
    "python-dotenv>=1.2.3,<2",
]

[dependency-groups]
dev = ["pytest>=9.1.1,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["ragwell"]
