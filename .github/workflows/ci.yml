name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_full: ${{ steps.classify.outputs.run_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run SDK matrix only when non-documentation files change
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=""
          known=false
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ -n "${PR_BASE_SHA}" && -n "${PR_HEAD_SHA}" ]] &&
              merge_base="$(git merge-base "${PR_BASE_SHA}" "${PR_HEAD_SHA}")" &&
              changed="$(git diff --name-only "${merge_base}" "${PR_HEAD_SHA}")"; then
              known=true
            fi
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]] &&
              git cat-file -e "${BEFORE_SHA}^{commit}" &&
              changed="$(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}")"; then
              known=true
            fi
          fi

          run_full=true
          if [[ "${known}" == true && -n "${changed}" ]]; then
            run_full=false
            while IFS= read -r path; do
              case "${path}" in
                docs/*|README.md|CONTRIBUTING.md|CHANGELOG.md|SECURITY.md|contracts/README.md|examples/async_project/README.md|.github/workflows/docs.yml)
                  ;;
                *)
                  run_full=true
                  break
                  ;;
              esac
            done <<< "${changed}"
          fi
          echo "run_full=${run_full}" >> "${GITHUB_OUTPUT}"
          echo "Run full SDK matrix: ${run_full}"

  check:
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Type check
        run: uv run --locked mypy
      - name: Verify deterministic contract generation
        run: uv run --locked python scripts/generate.py --check
      - name: Build distributions and test clean installation
        run: uv run --locked pytest
      - name: Qualify declared minimum runtime dependencies
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          uv run --locked python -m build --no-isolation
          uv venv .dependency-floor --python 3.11
          uv pip install --python .dependency-floor/bin/python attrs==22.2.0 httpcore==1.0.9 httpx==0.27.2 python-dateutil==2.8.2
          wheel="$(find dist -maxdepth 1 -name 'ragwell-*.whl' -print -quit)"
          test -n "${wheel}"
          uv pip install --python .dependency-floor/bin/python --no-deps "${wheel}"
          .dependency-floor/bin/python -I -c "import ragwell; c = ragwell.Ragwell(base_url='https://api.example.test', api_key='test-key'); c.close()"

  os-smoke:
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked
      - name: Exercise installed package, files, transport and lifecycle
        run: uv run --locked pytest
