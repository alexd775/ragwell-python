name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Type check
        run: uv run --locked mypy
      - name: Verify deterministic contract generation
        run: uv run --locked python scripts/generate.py --check
      - name: Build distributions and test clean installation
        run: uv run --locked pytest
      - name: Qualify declared minimum runtime dependencies
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          uv run --locked python -m build --no-isolation
          uv venv .dependency-floor --python 3.11
          uv pip install --python .dependency-floor/bin/python attrs==22.2.0 httpx==0.27.2 python-dateutil==2.8.2
          uv pip install --python .dependency-floor/bin/python --no-deps dist/ragwell-0.1.0.dev0-py3-none-any.whl
          .dependency-floor/bin/python -I -c "import ragwell; c = ragwell.Ragwell(base_url='https://api.example.test', api_key='test-key'); c.close()"

  os-smoke:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked
      - name: Exercise installed package, files, transport and lifecycle
        run: uv run --locked pytest
