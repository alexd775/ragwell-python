name: Examples

on:
  push:
    branches: [main]
    paths:
      - "examples/async_project/**"
      - "!examples/async_project/README.md"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "examples/async_project/**"
      - "!examples/async_project/README.md"
      - ".github/workflows/examples.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  async-project:
    name: Async project / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/async_project
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.12"
          enable-cache: true
      - name: Install example with the published SDK
        run: uv sync --locked --python 3.12
      - name: Exercise example scripts without API access
        run: uv run --locked pytest
