[build-system]
requires = ["hatchling>=1.32.3,<2"]
build-backend = "hatchling.build"

[project]
name = "ragwell"
version = "0.1.0"
description = "Typed Python SDK for the Ragwell managed retrieval API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "attrs>=22.2,<26",
    "httpx>=0.27.2,<0.29",
    "httpcore>=1.0.9,<1.1",
    "python-dateutil>=2.8.2,<3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/alexd775/ragwell-python"
Issues = "https://github.com/alexd775/ragwell-python/issues"

[dependency-groups]
dev = [
    "build>=1.6.1,<2",
    "hatchling>=1.32.3,<2",
    "mypy>=2.3.1,<3",
    "openapi-python-client==0.29.0",
    "pytest>=9.1.1,<10",
    "ruff>=0.16.8,<0.17",
]

[tool.uv]
required-version = "==0.12.17"

[tool.hatch.build.targets.wheel]
packages = ["src/ragwell"]

[tool.hatch.build.targets.wheel.force-include]
"contracts/2026-09-19.1/openapi.json" = "ragwell/_contract/openapi.json"
"contracts/2026-09-19.1/manifest.json" = "ragwell/_contract/manifest.json"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/contracts",
    "/docs",
    "/examples",
    "/qualification",
    "/scripts",
    "/AGENTS.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/openapi-python-client.yaml",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/ragwell/_generated/**" = ["UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]
filterwarnings = ["error"]
